[meta]
name = "crtsh"
description = "Native Python asynchronous coroutine prober querying crt.sh Certificate Transparency logs with zero binary dependencies."
one_line_summary = "native async Certificate Transparency log asset discovery prober"
category = "Asset Discovery"
binary = "crtsh"
execution_tier = "coroutine"
categories = ["recon", "osint", "tls", "dns"]
theory = """
### Protocol Theory & Certificate Transparency (RFC 6962)
Certificate Authorities must append all publicly issued SSL/TLS certificates to tamper-evident,
append-only cryptographic audit logs. Querying CT logs surfaces valid subdomains and SAN entries.
"""

[input]
accepts = ["domain.info", "dns.record"]
target_types = ["domain"]

[output]
produces = ["domain.info", "tls.certificate"]

[execution]
tier = "coroutine"
output_format = "coroutine"
supports_streaming_parse = true
default_timeout_sec = 120.0

[flags]
allowed = ["--domain"]
blocked = ["-oG", "-oN", "-oA", "--script", "--proxy", "-iL", "--config", "--eval"]
compound_delimiters = ["=", ":", ","]

[profiles]
fast = ["--domain", "{domain}"]
