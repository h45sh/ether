[meta]
name = "netexec"
description = "High-performance network execution and credential spraying tool (successor to CrackMapExec) automating assessment and exploitation of Active Directory, SMB, SSH, WinRM, and LDAP services."
one_line_summary = "Active Directory & network credential spraying Swiss army knife"
category = "Network Reconnaissance"
binary = "nxc"
categories = ["network", "recon", "exploit", "active_directory"]
theory = """
### Theory & Active Directory Protocol Auditing
In enterprise Windows environments, authentication and administration rely heavily on multi-layered protocols: Server Message Block (SMB), Kerberos, NTLM, and Lightweight Directory Access Protocol (LDAP). NetExec interfaces directly with these protocols to audit configuration flaws and credential exposures.

### Protocol Mechanics & Attack Surfaces
* **SMB Signing**: Without cryptographically enforced message signing, attackers can execute Man-in-the-Middle (MitM) attacks and relay intercepted NTLM authentication to secondary network servers (NTLM Relay).
* **Null & Guest Sessions**: Historical Windows implementations permitted unauthenticated null sessions (`IPC$`), allowing anonymous actors to list domain accounts, password policies, and file shares.
* **Credential Spraying & Password Spraying**: Testing a single common password against hundreds of domain users avoids account lockout thresholds while discovering weak accounts.
* **Pwn3d Status**: Indicates that authenticated credentials possess local Administrator or Domain Administrator rights, permitting remote command execution (via PsExec, WMI, or WinRM).

### Defensive Hardening & Remediation
* **Enforce SMB Signing**: Mandate SMB signing via Group Policy (`Microsoft network server: Digitally sign communications (always)`).
* **Disable NTLM & Migrate to Kerberos**: Decommission legacy NTLMv1 and restrict NTLMv2 using Protected Users security groups.
* **Account Lockout Policies & Tiered Administration**: Enforce tiered administration (Tier 0 Domain Controllers never logging onto Tier 1/2 workstations) to block lateral credential harvesting.
"""

[input]
accepts = ["network.host", "network.service"]
target_types = ["ip", "cidr", "domain"]

[output]
produces = ["network.host", "network.service", "audit.misconfig", "credential.found"]

[execution]
tier = "subprocess"
output_format = "text"
supports_streaming_parse = true
default_timeout_sec = 120.0

[flags]
allowed = ["--gen-relay-list", "-u", "-p", "--shares", "--pass-pol"]
blocked = ["-oG", "-oN", "-oA", "--script", "--proxy", "-iL", "--config", "--eval"]
compound_delimiters = ["=", ":", ","]

[profiles]
fast = ["smb", "{target}", "--gen-relay-list", "/tmp/relay_targets.txt"]
standard = ["smb", "{target}", "-u", "''", "-p", "''", "--shares"]
deep = ["smb", "{target}", "-u", "guest", "-p", "''", "--pass-pol"]
