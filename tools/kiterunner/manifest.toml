[meta]
name = "kiterunner"
description = "High-speed routing and content discovery tool specialized in REST, Swagger, and GraphQL APIs."
one_line_summary = "high-speed modern API and microservice endpoint discovery"
category = "Web Enumeration"
categories = ["web", "api", "recon"]
binary = "kr"
theory = """
### Protocol Theory & Microservice API Routing
Kiterunner tests known OpenAPI/Swagger endpoint schemas and routes against target HTTP servers.
It identifies API paths and verbs even when documentation is unlinked.
"""

[modes]
learning = true
power = true

[input]
accepts = ["web.endpoint", "network.service"]

[output]
produces = ["web.endpoint"]

[learning]
enabled = true

[[learning.recipes]]
name = "API Route Discovery"
difficulty = "Beginner"
description = "Fast API route scan using common REST schemas."
flags = ["scan", "-o", "json"]
