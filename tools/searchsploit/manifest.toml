[meta]
name = "searchsploit"
description = "Command-line search utility for Exploit-DB, enabling offline discovery of verified exploits, PoCs, and CVE references."
one_line_summary = "offline Exploit-DB and public PoC intelligence lookup"
category = "Vulnerability Assessment"
binary = "searchsploit"
categories = ["exploit", "cve", "recon"]
theory = """
### Theory & Vulnerability Lifecycle
Vulnerability research correlates software version strings identified during reconnaissance against public CVE databases and verified exploit archives.

### Exploit Architecture & Classification
* **Remote (`remote`)**: Weaponized exploits executable over a network socket without valid credentials.
* **Privilege Escalation (`local`)**: Requires an unprivileged shell to escalate to root or SYSTEM rights.
* **Web Applications (`webapps`)**: Exploits targeting SQLi, RCE, LFI, and SSRF in web frameworks.
* **Offline Verification**: Operates fully disconnected from the internet, ideal for air-gapped environments.

### Defensive Hardening & Governance
* **Patch Cadence**: Maintain an aggressive patch schedule for internet-facing daemons.
* **Principle of Least Privilege**: Isolate daemons in unprivileged accounts with SELinux/AppArmor confinement.
"""

[input]
accepts = ["network.service", "vulnerability.found", "network.host"]
target_types = ["keyword", "domain", "ip"]

[output]
produces = ["exploit.reference"]

[execution]
tier = "subprocess"
output_format = "ndjson"
supports_streaming_parse = true
default_timeout_sec = 120.0

[flags]
allowed = ["--json", "-t", "--cve", "-w"]
blocked = ["-oG", "-oN", "-oA", "--script", "--proxy", "-iL", "--config", "--eval"]
compound_delimiters = ["=", ":", ","]

[profiles]
fast = ["--json"]
standard = ["-t", "Remote", "--json"]
deep = ["--cve", "2021-41773", "--json"]
