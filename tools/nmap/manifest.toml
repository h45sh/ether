[meta]
name = "nmap"
description = "Network host and port scanner and network security auditing suite."
one_line_summary = "discover hosts, open ports, and running services across a network"
category = "Network Reconnaissance"
binary = "nmap"
categories = ["recon", "enumeration", "network"]
theory = """
### Protocol Theory & RFC 793 Standards
Network enumeration interrogates the remote operating system's transport-layer stack (RFC 793) to deduce listening socket states.

### Core Mechanics & Wire-Level Probing
* **TCP SYN Half-Open (`-sS`)**: Injects raw `SYN` frames. If listening, server replies `SYN/ACK`. Nmap terminates immediately with `RST` to evade application connection logging.
* **Service Versioning (`-sV`)**: Matches welcome banners against `nmap-service-probes` database (SSH, HTTP Server, FTP).
* **OS Fingerprinting (`-O`)**: Probes window scale, initial sequence number (ISN) drift, and IP ID predictability.

### Defensive Hardening & Detection
* **Stateful Firewalls**: Drop unsolicited packets (`DROP` vs `REJECT/RST`) to induce timeouts.
* **IDS/IPS Rules**: Monitor high-frequency SYN flag sequences across non-contiguous destination ports.
"""

[input]
accepts = ["network.host"]
target_types = ["ip", "cidr", "domain"]

[output]
produces = ["network.service"]

[execution]
tier = "subprocess"
output_format = "xml"
supports_streaming_parse = true
default_timeout_sec = 120.0

[flags]
allowed = ["-sV", "-Pn", "-sS", "--top-ports", "-sC", "-p-", "-T4", "-sU", "-O", "--noninteractive", "-oX", "-oN", "-oG", "-oA", "-p", "-sT", "-A", "-F", "-n", "-v", "-vv", "--open", "--reason", "-T1", "-T2", "-T3", "-T5"]
blocked = ["--script", "--proxy", "-iL", "--config", "--eval"]
compound_delimiters = ["=", ":", ","]

[profiles]
fast = ["-sV"]
standard = ["-sV", "-Pn"]
deep = ["-sS", "-sV", "--top-ports", "100"]
