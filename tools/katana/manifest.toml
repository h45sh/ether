[meta]
name = "katana"
description = "Next-generation headless web crawler and JavaScript analysis engine written in Go for Single Page Applications (SPAs)."
one_line_summary = "next-gen headless web crawler and JS analysis engine"
category = "Web Enumeration"
categories = ["web", "recon", "crawler"]
binary = "katana"
theory = """
### Protocol Theory & Client-Side Endpoint Crawling
Katana executes headless browser rendering and AST parsing of JavaScript files to uncover
dynamic API endpoints, hidden forms, and client-side routes.
"""

[modes]
learning = true
power = true

[input]
accepts = ["web.endpoint", "network.service", "domain.info"]
target_types = ["url"]

[output]
produces = ["web.endpoint"]

[learning]
enabled = true

[[learning.recipes]]
name = "Headless Depth Crawl"
difficulty = "Beginner"
description = "Crawl website endpoints with JSON streaming output."
flags = ["-d", "2", "-jsonl"]
