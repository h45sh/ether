[meta]
name = "nuclei"
description = "Fast, customizable vulnerability scanner powered by community-authored YAML templates covering CVEs, misconfigurations, and technology fingerprints."
one_line_summary = "template-based vulnerability scanner and misconfiguration auditor"
category = "Vulnerability Assessment"
binary = "nuclei"
categories = ["vulnerability", "scanner", "cve", "dast"]
theory = """
### Theory & Declarative Vulnerability Verification
Nuclei verifies vulnerabilities using declarative YAML templates. Rather than brute-force fuzzing, templates model the exact network interaction required to confirm a vulnerability.

### Multi-Protocol Architecture & Mechanics
* **Declarative DSL**: Combines raw request frames, payload substitutions, and extraction variables.
* **Multi-Protocol Coverage**: Audits HTTP/S, DNS, SSL/TLS, TCP raw sockets, Websockets, and headless browsers.
* **Cryptographic Matchers**: Requires exact reflection strings, status codes, or hash matches to guarantee zero false positives.

### Defensive Remediation & CI/CD
* **Deterministic Root Cause Patching**: Remediates the root vulnerability pinpointed by template IDs.
* **DevSecOps Integration**: Embeds Nuclei in CI/CD pipelines to block builds containing known CVEs.
"""

[input]
accepts = ["network.host", "web.endpoint", "dns.record"]
target_types = ["url"]

[output]
produces = ["vulnerability.found", "audit.misconfig", "web.technology"]

[execution]
tier = "subprocess"
output_format = "ndjson"
supports_streaming_parse = true
default_timeout_sec = 120.0

[flags]
allowed = ["-u", "-severity", "-tags", "-jsonl", "-c", "-rate-limit", "-target", "-list", "-l", "-j", "-silent", "-s", "-exposure"]
blocked = ["-oG", "-oN", "-oA", "--script", "--proxy", "-iL", "--config", "--eval"]
compound_delimiters = ["=", ":", ","]

[profiles]
fast = ["-u", "{url}", "-severity", "critical,high", "-tags", "cve", "-jsonl"]
standard = ["-u", "{url}", "-tags", "tech", "-severity", "info", "-jsonl"]
deep = ["-u", "{url}", "-tags", "misconfig,exposure", "-severity", "medium,high", "-jsonl"]
