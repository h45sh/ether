[meta]
name = "cve_search"
description = "Local offline CVE and vulnerability database search tool mapping software names and versions to CVSS v3 ratings."
one_line_summary = "offline local CVE and CVSS v3 vulnerability query utility"
category = "Vulnerability Assessment"
categories = ["vuln", "cve", "offline"]
binary = "cve_search"
theory = """
### Protocol Theory & Vulnerability Mapping
Matches identified software names and version numbers against local CVE dictionaries to surface
known Common Vulnerabilities and Exposures (CVEs) without outbound network queries.
"""

[modes]
learning = true
power = true

[input]
accepts = ["network.service", "web.endpoint", "host.software_package"]

[output]
produces = ["vulnerability.found"]

[learning]
enabled = true

[[learning.recipes]]
name = "Version CVE Lookup"
difficulty = "Beginner"
description = "Search local CVE database for vulnerabilities matching discovered service versions."
flags = ["--json"]
