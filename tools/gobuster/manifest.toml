[meta]
name = "gobuster"
description = "High-speed URI directory, file path, and DNS subdomain brute-forcing scanner written in Go."
one_line_summary = "brute-force hidden directories, files, and endpoints on web servers"
category = "Web Enumeration"
binary = "gobuster"
categories = ["recon", "web", "brute-force"]
theory = """
### Protocol Theory & RFC 7230/7231 URI Traversal
Web servers route incoming HTTP request URIs to disk files or routing handlers. Gobuster executes deterministic dictionary traversal over concurrent worker routines.

### Response Classification & Attack Vectors
* **Status Triage**: Identifies live paths (`200 OK`), redirects (`301/302`), restricted portals (`401/403`), and unhandled application crashes (`500`).
* **Unlinked Assets**: Discovers administrative consoles (`/admin`), leaked VCS files (`/.git`), and environment configurations (`/.env`).
* **Extension Permutations**: Appends specific server extensions (`.php`, `.bak`, `.sql`, `.json`) to find exposed backups.

### Defensive Hardening & Mitigation
* **Directory Indexing**: Explicitly disable `Options -Indexes` and default file directory listings.
* **WAF Rate Limiting**: Deploy IP request rate throttles (e.g. Nginx `limit_req`) to block high-frequency scans.
"""

[input]
accepts = ["network.service", "web.endpoint"]
target_types = ["url"]

[output]
produces = ["web.endpoint"]

[execution]
tier = "subprocess"
output_format = "text"
supports_streaming_parse = true
default_timeout_sec = 120.0

[flags]
allowed = ["-u", "-w", "-t", "-x", "-s", "-b", "--exclude-length"]
blocked = ["-oG", "-oN", "-oA", "--script", "--proxy", "-iL", "--config", "--eval"]
compound_delimiters = ["=", ":", ","]

[profiles]
fast = ["dir", "-u", "{url}", "-w", "{wordlist:common_dirs}"]
standard = ["dir", "-u", "{url}", "-w", "{wordlist:common_dirs}", "-t", "50"]
deep = ["dir", "-u", "{url}", "-w", "{wordlist:common_dirs}", "-x", "php,html,json,txt,bak"]
