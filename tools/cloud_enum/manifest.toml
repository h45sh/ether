[meta]
name = "cloud_enum"
description = "Multi-cloud OSINT tool enumerating public S3 buckets, Azure blobs, and Google Cloud storage."
one_line_summary = "multi-cloud OSINT public storage and resource enumerator"
category = "Asset Discovery"
binary = "cloud_enum"
categories = ["cloud", "osint", "recon"]
theory = """
### Protocol Theory & Cloud Storage Enumeration
Cloud providers host public object storage using predictable URI patterns.
Cloud_enum audits DNS and HTTP responses to discover exposed corporate buckets.
"""

[input]
accepts = ["domain.info", "dns.record"]
target_types = ["domain"]

[output]
produces = ["cloud.asset"]

[execution]
tier = "subprocess"
output_format = "text"
supports_streaming_parse = true
default_timeout_sec = 120.0

[flags]
allowed = ["-l", "-", "-k"]
blocked = ["-oG", "-oN", "-oA", "--script", "--proxy", "-iL", "--config", "--eval"]
compound_delimiters = ["=", ":", ","]

[profiles]
fast = ["-l", "-"]
