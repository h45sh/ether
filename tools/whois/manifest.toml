[meta]
name = "whois"
description = "Retrieve domain registration, ownership records, netblock assignments, and Autonomous System (ASN) routing intelligence."
one_line_summary = "ownership, registrar, and IP netblock intelligence"
category = "Network Reconnaissance"
binary = "whois"
categories = ["recon", "osint"]
theory = """
### Protocol Theory & RFC 3912 Architecture
The WHOIS protocol (RFC 3912) queries hierarchical registries over TCP port 43 to retrieve domain ownership and routing data.

### Core Architecture & RIRs
* **Regional Registries (RIRs)**: Five global entities (ARIN, RIPE, APNIC, LACNIC, AFRINIC) govern CIDR netblock ownership.
* **Autonomous System Numbers (ASNs)**: Resolves BGP routing origin networks attributed to carriers and cloud providers.
* **Domain Attribution**: Identifies registrar authority, registration dates, and upstream DNS delegation points.

### Defensive Hardening & Privacy
* **Privacy Proxy Services**: Obfuscate administrative PII behind accredited registrar proxies.
* **RDAP Migration (RFC 7480-7484)**: Move to RESTful JSON directory protocol with role-based authenticated access.
"""

[input]
accepts = ["dns.record", "network.host"]
target_types = ["domain", "ip"]

[output]
produces = ["domain.info", "network.netblock", "network.host"]

[execution]
tier = "subprocess"
output_format = "text"
supports_streaming_parse = true
default_timeout_sec = 120.0

[flags]
allowed = ["-h"]
blocked = ["-oG", "-oN", "-oA", "--script", "--proxy", "-iL", "--config", "--eval"]
compound_delimiters = ["=", ":", ","]

[profiles]
fast = ["-h", "whois.arin.net"]
