[meta]
name = "nikto"
description = "Comprehensive web server scanner for finding dangerous files, outdated server software, insecure HTTP headers, and server misconfigurations."
one_line_summary = "scan web servers for security misconfigurations and obsolete software"
category = "Vulnerability Assessment"
binary = "nikto"
categories = ["vuln", "web", "scanner"]
theory = """
### Protocol Theory & Heuristic Vulnerability Auditing
Nikto queries over 6,700 known vulnerabilities, dangerous scripts, and software configuration weaknesses across web servers (RFC 2616).

### Primary Audit Vectors
* **Dangerous HTTP Methods**: Probes for insecure WebDAV and legacy methods (`PUT`, `DELETE`, `TRACE`). Detects Cross-Site Tracing (XST).
* **Defensive Header Auditing**: Audits missing security headers: `Strict-Transport-Security` (HSTS), `Content-Security-Policy` (CSP), and `X-Frame-Options`.
* **Outdated Server Fingerprints**: Matches `Server` and `X-Powered-By` version strings against CVE registries.

### Defensive Hardening & Remediation
* **Banner Suppression**: Obfuscate daemon banners (`ServerTokens Prod`, `server_tokens off`).
* **Enforce Security Headers**: Implement modern headers to block client-side injection and clickjacking.
"""

[input]
accepts = ["network.service", "web.endpoint", "network.host"]
target_types = ["url"]

[output]
produces = ["vulnerability.found", "web.vulnerability", "web.endpoint"]

[execution]
tier = "subprocess"
output_format = "text"
supports_streaming_parse = true
default_timeout_sec = 120.0

[flags]
allowed = ["-h", "-p", "-ssl", "-Tuning"]
blocked = ["-oG", "-oN", "-oA", "--script", "--proxy", "-iL", "--config", "--eval"]
compound_delimiters = ["=", ":", ","]

[profiles]
fast = ["-h", "{target}"]
standard = ["-h", "{target}", "-p", "{port}"]
deep = ["-h", "{target}", "-ssl"]
