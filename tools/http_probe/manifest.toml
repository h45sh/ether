[meta]
name = "http_probe"
description = "Pure-Python asynchronous HTTP discovery, banner grabbing, and web technology identification engine."
one_line_summary = "zero-binary in-process HTTP discovery engine"
category = "Web Enumeration"
binary = ""
execution_tier = "coroutine"
categories = ["recon", "web", "http"]
theory = """
### HTTP Protocol Discovery & RFC 9110/9112 Mechanics
High-performance asynchronous HTTP/1.1 and HTTP/2 probing extracts service banners, response codes, page titles, and web technologies directly in-process without spawning external processes.

### Pre-Connect SSRF Defense
Under `GatePolicy.SAFE`, every target endpoint is resolved via DNS before initiating TCP connections. Any destination mapping to cloud metadata (169.254.169.254, fd00:ec2::254), loopback (127.0.0.0/8, ::1), or link-local subnets is aborted with `PolicyViolationError` to prevent Server-Side Request Forgery.
"""

[input]
accepts = ["web.endpoint", "network.service", "network.host", "dns.record", "domain.info"]
target_types = ["url", "ip", "domain"]

[output]
produces = ["web.endpoint", "network.service", "web.technology"]

[execution]
tier = "coroutine"
output_format = "coroutine"
supports_streaming_parse = true
default_timeout_sec = 120.0

[flags]
allowed = []
blocked = ["-oG", "-oN", "-oA", "--script", "--proxy", "-iL", "--config", "--eval"]
compound_delimiters = ["=", ":", ","]
