[meta]
name = "stealth_scan"
description = "Native Python stealth packet crafting engine (TCP SYN half-open sweep, Layer 2 ARP discovery, port-knocking) with unprivileged fallback."
one_line_summary = "native async stealth packet prober and port-knocker"
category = "Network Reconnaissance"
binary = "stealth_scan"
execution_tier = "coroutine"
categories = ["recon", "network", "stealth"]
theory = """
### Stealth Packet Crafting & TCP SYN Scanning
Stealth scanning avoids completing the standard TCP 3-way handshake by transmitting a raw TCP SYN packet.
If the remote port is listening, it responds with SYN-ACK, which is immediately met with a TCP RST to tear down
the connection before the application-layer socket enters an established state, minimizing application logs.
When running without raw socket privileges (CAP_NET_RAW / root), execution gracefully falls back to non-blocking
asynchronous TCP connect probes.
"""

[input]
accepts = ["network.host", "network.service"]
target_types = ["ip", "cidr", "domain"]

[output]
produces = ["network.host", "network.service"]

[execution]
tier = "coroutine"
output_format = "coroutine"
supports_streaming_parse = true
default_timeout_sec = 120.0

[flags]
allowed = ["--mode", "--ports", "--knock-sequence", "-m", "-p"]
blocked = ["-oG", "-oN", "-oA", "--script", "--proxy", "-iL", "--config", "--eval"]
compound_delimiters = ["=", ":", ","]

[profiles]
fast = ["--mode", "syn", "--ports", "22,80,443"]
standard = ["--mode", "arp"]
deep = ["--mode", "knock", "--knock-sequence", "7000,8000,9000"]
