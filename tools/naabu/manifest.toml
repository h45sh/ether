[meta]
name = "naabu"
description = "Fast, asynchronous SYN/Connect port scanner written in Go designed to enumerate active ports efficiently."
one_line_summary = "high-performance asynchronous port discovery scanner"
category = "Network Reconnaissance"
binary = "naabu"
categories = ["recon", "network", "portscan"]
theory = """
### Protocol Theory & Port Enumeration
Naabu performs high-throughput TCP port scans using either raw SYN packets or full TCP handshakes.
It emits streaming JSON records containing host IPs and open port states.
"""

[input]
accepts = ["network.host", "dns.record", "domain.info"]
target_types = ["ip", "cidr", "domain"]

[output]
produces = ["network.service"]

[execution]
tier = "subprocess"
output_format = "ndjson"
supports_streaming_parse = true
default_timeout_sec = 120.0

[flags]
allowed = ["-top-ports", "-json", "-host"]
blocked = ["-oG", "-oN", "-oA", "--script", "--proxy", "-iL", "--config", "--eval"]
compound_delimiters = ["=", ":", ","]

[profiles]
fast = ["-top-ports", "100", "-json"]
