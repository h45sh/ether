[meta]
name = "redis_probe"
description = "Native Python asynchronous coroutine prober evaluating unauthenticated Redis databases and INFO command disclosure."
one_line_summary = "native async Redis unauthenticated access and INFO disclosure auditor"
category = "Database Assessment"
binary = "redis_probe"
execution_tier = "coroutine"
categories = ["database", "auth", "recon"]
theory = """
### Protocol Theory & Redis RESP (REdis Serialization Protocol)
Redis operates over plain TCP using the human-readable RESP protocol.
Default deployments without 'requirepass' allow direct unauthenticated command execution (INFO, CONFIG, KEYS).
"""

[input]
accepts = ["network.service", "network.host"]
target_types = ["ip", "cidr", "domain"]

[output]
produces = ["database.service"]

[execution]
tier = "coroutine"
output_format = "coroutine"
supports_streaming_parse = true
default_timeout_sec = 120.0

[flags]
allowed = ["--port"]
blocked = ["-oG", "-oN", "-oA", "--script", "--proxy", "-iL", "--config", "--eval"]
compound_delimiters = ["=", ":", ","]

[profiles]
fast = ["--port", "6379"]
