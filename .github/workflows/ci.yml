name: CI

on:
  push:
    branches: [ "main", "dev" ]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches: [ "main", "dev" ]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".gitignore"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality & Schema Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Ruff Lint & Format Check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run Strict Static Type Check (MyPy)
        run: uv run mypy src/ether

      - name: Run Targeted Mutation Testing (Tier 1 Core)
        run: uv run python3 tests/mutation/run_mutation_tests.py --target=canonicalize

      - name: Verify Schema Registry Documentation Sync
        run: uv run python3 scripts/generate_schema_registry.py --check

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: [lint]
    if: ${{ !startsWith(github.head_ref, 'release-please') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Tier 0 AST Architectural & Mathematical Invariants
        run: uv run pytest -m tier0 -q

      - name: Run Full Regression Test Suite with Branch Coverage
        run: uv run pytest tests/ --cov=src/ether --cov-branch --cov-fail-under=75 --cov-report=term-missing:skip-covered

      - name: Build Distribution Packages (sdist & wheel)
        run: uv build

  test-macos:
    name: Test (macOS, Python 3.12)
    needs: [lint]
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main')) && !startsWith(github.head_ref, 'release-please') }}
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Tier 0 AST Architectural & Mathematical Invariants
        run: uv run pytest -m tier0 -q

      - name: Run Full Regression Test Suite
        run: uv run pytest tests/
