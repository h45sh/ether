[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ether-core"
version = "0.1.3"
description = "Reactive process supervisor and graph telemetry engine for security tools and autonomous agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "Harshwardhan Patil", email = "harshwardhan@h45sh.com" },
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
]
dependencies = [
    "pydantic>=2.0.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.0",
    "dnspython>=2.6.0",
    "cryptography>=42.0.0",
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "sqlite-vec>=0.1.9",
    "scapy>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.4.0",
    "mypy>=1.15.0",
    "mutmut>=2.5.0",
]

[project.scripts]
ether = "ether.cli.router:main"

[project.urls]
Homepage = "https://github.com/h45sh/ether"
Documentation = "https://github.com/h45sh/ether/blob/main/docs/README.md"
Repository = "https://github.com/h45sh/ether"
Issues = "https://github.com/h45sh/ether/issues"
Changelog = "https://github.com/h45sh/ether/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/h45sh/ether/blob/main/ROADMAP.md"
Security = "https://github.com/h45sh/ether/blob/main/docs/SECURITY.md"

[tool.hatch.build.targets.wheel]
packages = ["src/ether", "tools"]

[tool.pytest.ini_options]
cache_dir = "tests/.pytest_cache"
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "tier0: Microsecond AST invariants and property-based mathematical tests",
    "fast: Fast in-memory engine and domain logic tests (< 5s)",
    "fuzz: Hostile stream and adapter parser fuzzing tests",
    "benchmark: Performance and regression benchmarks",
    "scenario: High-level behavioral contract scenarios",
]

[tool.coverage.run]
branch = true
source = ["src/ether"]
omit = [
    "src/ether/cli/formatters.py",
]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ether.schemas.base"
disallow_untyped_defs = true

[tool.mutmut]
source_paths = ["src/ether/common/canonicalize.py"]
pytest_add_cli_args_test_selection = ["tests/unit/test_canonicalize.py"]
debug = true

[tool.ruff]
target-version = "py311"
line-length = 100
cache-dir = "tests/.ruff_cache"

[tool.ruff.lint]
select = [
    "E9", "F63", "F7", "F82", "F401", "I", "ASYNC", "B",
]
ignore = [
    "ASYNC240", "ASYNC230", "ASYNC221",
]

[tool.ruff.lint.isort]
known-first-party = ["ether", "tools"]
